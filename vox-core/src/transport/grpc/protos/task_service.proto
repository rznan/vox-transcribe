syntax = "proto3";

package task_service;


import "google/protobuf/timestamp.proto";


enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_SUBMITTED = 1;
  TASK_STATUS_QUEUED = 2;
  TASK_STATUS_ASSIGNED = 3;
  TASK_STATUS_RUNNING = 4;
  TASK_STATUS_CANCEL_REQUESTED = 5;
  TASK_STATUS_CANCELLED = 6;
  TASK_STATUS_SUCCEEDED = 7;
  TASK_STATUS_FAILED = 8;
  TASK_STATUS_REQUEUED = 9;
}

message TaskLiteProto {
  int64 id = 1;
  string filename = 2;
  TaskStatus status = 3;
  int64 size = 4;
  int32 attempt_count = 5;
}

message TaskFullProto {
  int64 id = 1;
  string filename = 2;
  TaskStatus status = 3;
  int64 size = 4;
  int32 attempt_count = 5;
  string result = 6;
  string artifact_json = 7;
}

message BatchLiteProto {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 total_jobs_number = 3;
  int32 completed_jobs_number = 4;
}

message BatchFullProto {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  int32 total_jobs_number = 3;
  int32 completed_jobs_number = 4;
  repeated TaskLiteProto tasks = 5;
}

// --- Submissão ---

message SubmitTaskRequestProto {
  string artifact_json = 1;
  string filename = 2;
  int64 size = 3;
}

message SubmitBatchRequestProto {
  repeated SubmitTaskRequestProto tasks = 1;
}

message SubmitBatchResponseProto {
  int64 batch_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

// --- Consultas ---

message GetBatchRequestProto {
  int64 batch_id = 1;
}

message GetBatchResponseProto {
  BatchFullProto batch = 1;
}

message GetTaskRequestProto {
  int64 task_id = 1;
}

message GetTaskResponseProto {
  TaskFullProto task = 1;
}

// --- Listagem ---

message ListBatchesRequestProto {
  int32 limit = 1;
  int32 offset = 2;
}

message ListBatchesResponseProto {
  repeated BatchLiteProto batches = 1;
}

// --- Mutações (Update/Delete) ---

message CancelBatchRequestProto {
  int64 batch_id = 1;
}

message CancelBatchResponseProto {
  BatchLiteProto batch = 1;
}

message DeleteBatchRequestProto {
  int64 batch_id = 1;
}

message DeleteBatchResponseProto {
  bool success = 1;
}

service TaskGrpcService {
  rpc SubmitBatch(SubmitBatchRequestProto) returns (SubmitBatchResponseProto);
  rpc GetBatch(GetBatchRequestProto) returns (GetBatchResponseProto);
  rpc GetTask(GetTaskRequestProto) returns (GetTaskResponseProto);
  rpc ListBatches(ListBatchesRequestProto) returns (ListBatchesResponseProto);
  rpc CancelBatch(CancelBatchRequestProto) returns (CancelBatchResponseProto);
  rpc DeleteBatch(DeleteBatchRequestProto) returns (DeleteBatchResponseProto);
}
